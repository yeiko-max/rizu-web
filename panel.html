<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>if(/github\.io$/.test(location.hostname))location.replace('https://rizuapp.com'+location.pathname.replace(/^\/rizu-web/,'')+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del dueño — Rizú</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6D28D9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--fondo); }
  .panel { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
  .cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .cab h1 { margin: 0; font-size: 28px; }
  .cab .meta { color: var(--texto-suave); font-size: 14px; }
  .ctrl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ctrl select, .ctrl button { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--borde); background: #fff; cursor: pointer; }
  .ctrl button.prim { background: var(--grad); color: #fff; border: 0; font-weight: 700; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 16px 18px; }
  .kpi small { display: block; color: var(--texto-suave); font-size: 13px; font-weight: 600; }
  .kpi b { display: block; font-size: 30px; line-height: 1.15; margin-top: 4px; letter-spacing: -0.5px; }
  .kpi span { font-size: 12.5px; color: var(--texto-suave); }
  .kpi.destaca { background: var(--grad); color: #fff; border: 0; }
  .kpi.destaca small, .kpi.destaca span { color: rgba(255,255,255,.85); }
  .rejilla { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 820px) { .rejilla { grid-template-columns: 1fr; } }
  .caja { background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 18px; overflow: hidden; }
  .caja h2 { font-size: 16px; margin: 0 0 4px; }
  .caja .sub2 { color: var(--texto-suave); font-size: 13px; margin: 0 0 12px; }
  .leyenda { display: flex; gap: 14px; font-size: 13px; color: var(--texto-suave); margin-bottom: 6px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  table.lista { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.lista th { text-align: left; color: var(--texto-suave); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  table.lista td { padding: 8px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  table.lista tr:last-child td { border-bottom: 0; }
  .tabla-scroll { overflow-x: auto; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--violeta-suave); color: var(--violeta-osc); white-space: nowrap; }
  .chip.ok { background: #DCFCE7; color: #166534; } .chip.mal { background: #FEE2E2; color: #991B1B; } .chip.aviso { background: #FEF3C7; color: #92400E; }
  .barra-h { display: grid; grid-template-columns: 120px 1fr 36px; gap: 8px; align-items: center; font-size: 13.5px; margin: 6px 0; }
  .barra-h > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra-h div { height: 10px; background: var(--violeta-suave); border-radius: 6px; overflow: hidden; }
  .barra-h div span { display: block; height: 100%; background: var(--grad); }
  .vacio2 { color: var(--texto-suave); font-size: 14px; padding: 8px 0; }
  .login { max-width: 400px; margin: 60px auto; background: #fff; border: 1px solid var(--borde); border-radius: 20px; padding: 26px; }
  .login label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  .login input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--borde); border-radius: 12px; }
  .login button { width: 100%; margin-top: 16px; }
  .err { color: #B91C1C; font-size: 14px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<header class="barra">
  <div class="contenedor nav">
    <a class="logo" href="./" aria-label="Rizú, inicio"><span class="logo-marca" aria-hidden="true"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M44 20c-4-6-13-8-19.5-4C18 20 16 29 19.5 36S32 46 39 42.5s8.5-12.5 3.5-17.5-13-3.5-14.5 2 3 9.5 7.5 7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 9l1.6 3.9 3.9 1.6-3.9 1.6L49 20l-1.6-3.9-3.9-1.6 3.9-1.6z" fill="#fff"/></svg></span>rizú</a>
    <nav class="menu" aria-label="Panel"><a href="app.html">Ir a la web</a></nav>
  </div>
</header>
<main class="panel" id="vista"><div class="vacio2">Cargando…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var sb = window.supabase.createClient('https://jljuuytjivrxhjugxjaz.supabase.co', 'sb_publishable_O9HxRqA9a-VTyEogOj6cgg__E0dhlQO', { auth: { persistSession: true } });
  var vista = document.getElementById('vista');
  var dias = 30;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function euros(c) { return (Number(c || 0) / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); }
  function num(n) { return Number(n || 0).toLocaleString('es-ES'); }
  function fecha(f) { return f ? new Date(f).toLocaleString('es-ES', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }
  var ESTADOS = { pendiente: ['Pendiente', 'aviso'], aceptada: ['Aceptada', ''], en_camino: ['En camino', ''], en_curso: ['En curso', ''], completada: ['Completada', 'ok'], cancelada_cliente: ['Cancelada (cliente)', 'mal'], cancelada_profesional: ['Cancelada (pro)', 'mal'], rechazada: ['Rechazada', 'mal'], no_presentado: ['No presentado', 'mal'] };
  function chipEstado(e) { var x = ESTADOS[e] || [e, '']; return '<span class="chip ' + x[1] + '">' + esc(x[0]) + '</span>'; }
  var ROLES = { cliente: 'Cliente', profesional: 'Profesional', admin: 'Admin' };

  function pintarLogin(msg) {
    vista.innerHTML = '<form class="login" id="f"><h1 style="margin:0 0 4px;font-size:24px">Panel del dueño</h1><p class="meta" style="margin:0">Entra con tu cuenta de Rizú.</p>' +
      '<label for="e">Email</label><input id="e" type="email" autocomplete="email" required>' +
      '<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>' +
      '<button class="boton" type="submit">Entrar</button><div class="err" id="err">' + esc(msg || '') + '</div></form>';
    document.getElementById('f').addEventListener('submit', async function (ev) {
      ev.preventDefault();
      var r = await sb.auth.signInWithPassword({ email: document.getElementById('e').value.trim(), password: document.getElementById('p').value });
      if (r.error) { document.getElementById('err').textContent = 'Email o contraseña incorrectos.'; return; }
      cargar();
    });
  }

  function grafico(por) {
    var W = 720, H = 220, pl = 30, pb = 26, pt = 10, n = por.length || 1;
    var max = Math.max(1, Math.max.apply(null, por.map(function (d) { return Math.max(d.registros, d.reservas); })));
    var paso = (W - pl - 8) / n, bw = Math.max(2, paso / 2 - 2);
    var y = function (v) { return pt + (H - pt - pb) * (1 - v / max); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Registros y reservas por día">';
    var marcas = [0, Math.ceil(max / 2), max];
    marcas.forEach(function (m) { s += '<line x1="' + pl + '" x2="' + (W - 8) + '" y1="' + y(m) + '" y2="' + y(m) + '" stroke="#ECE6F5"/><text x="' + (pl - 6) + '" y="' + (y(m) + 4) + '" font-size="11" text-anchor="end" fill="#5E5873">' + m + '</text>'; });
    por.forEach(function (d, i) {
      var x = pl + i * paso + 2;
      s += '<rect x="' + x + '" y="' + y(d.registros) + '" width="' + bw + '" height="' + (H - pb - y(d.registros)) + '" rx="2" fill="#7C3AED"><title>' + d.dia + ': ' + d.registros + ' registros</title></rect>';
      s += '<rect x="' + (x + bw + 1) + '" y="' + y(d.reservas) + '" width="' + bw + '" height="' + (H - pb - y(d.reservas)) + '" rx="2" fill="#DB2777"><title>' + d.dia + ': ' + d.reservas + ' reservas</title></rect>';
      if (i % Math.ceil(n / 8) === 0 || i === n - 1) { var f = new Date(d.dia + 'T12:00:00'); s += '<text x="' + (x + bw) + '" y="' + (H - 8) + '" font-size="11" text-anchor="middle" fill="#5E5873">' + f.getDate() + '/' + (f.getMonth() + 1) + '</text>'; }
    });
    return s + '</svg>';
  }

  function pintar(d) {
    var t = d.totales;
    var v = d.visitas;
    function barras(lista, campo) {
      var mx = Math.max(1, Math.max.apply(null, (lista || []).map(function (x) { return x.visitas; }).concat([1])));
      return (lista || []).length ? lista.map(function (x) { return '<div class="barra-h"><span title="' + esc(x[campo]) + '">' + esc(x[campo]) + '</span><div><span style="width:' + Math.round(x.visitas / mx * 100) + '%"></span></div><b>' + num(x.visitas) + '</b></div>'; }).join('') : '<div class="vacio2">Sin visitas todavía.</div>';
    }
    var estados = d.reservas_por_estado || {};
    var maxTop = Math.max(1, Math.max.apply(null, (d.top_servicios || []).map(function (x) { return x.reservas; }).concat([1])));
    vista.innerHTML =
      '<div class="cab"><div><h1>Panel del dueño</h1><div class="meta">Actualizado ' + fecha(d.generado_en) + '</div></div>' +
      '<div class="ctrl"><select id="dias" aria-label="Periodo"><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="365">Último año</option></select>' +
      '<button class="prim" id="refrescar" type="button">Actualizar</button><button id="salir" type="button">Salir</button></div></div>' +

      '<div class="kpis">' +
      (v ? '<div class="kpi destaca"><small>Visitas a la web</small><b>' + num(v.periodo) + '</b><span>' + num(v.hoy) + ' hoy · ' + num(v.semana) + ' en 7 días · ' + (v.movil_pct != null ? v.movil_pct + ' % móvil' : '') + '</span></div>' : '') +
      '<div class="kpi destaca"><small>Usuarios registrados</small><b>' + num(t.usuarios) + '</b><span>+' + num(t.registros_hoy) + ' hoy · +' + num(t.registros_7d) + ' en 7 días</span></div>' +
      '<div class="kpi"><small>Clientes</small><b>' + num(t.clientes) + '</b><span>cuentas de cliente</span></div>' +
      '<div class="kpi"><small>Profesionales</small><b>' + num(t.profesionales) + '</b><span>' + num(t.pros_verificadas) + ' verificadas · ' + num(t.pros_disponibles) + ' disponibles</span></div>' +
      '<div class="kpi"><small>Reservas</small><b>' + num(t.reservas) + '</b><span>+' + num(t.reservas_hoy) + ' hoy · ' + num(t.reservas_proximas) + ' próximas</span></div>' +
      '<div class="kpi"><small>Completadas</small><b>' + num(t.completadas) + '</b><span>' + euros(t.facturado_cent) + ' en servicios</span></div>' +
      '<div class="kpi"><small>Comisión de Rizú</small><b>' + euros(t.comision_cent) + '</b><span>modo piloto: 0 %</span></div>' +
      '<div class="kpi"><small>Nota media pros</small><b>' + (t.nota_media_pros != null ? '★ ' + Number(t.nota_media_pros).toLocaleString('es-ES') : '—') + '</b><span>' + num(t.valoraciones) + ' valoraciones</span></div>' +
      '<div class="kpi"><small>Pendiente de revisar</small><b>' + num(t.solicitudes_sin_ver + t.contactos_sin_ver) + '</b><span>' + num(t.solicitudes_sin_ver) + ' solicitudes pro · ' + num(t.contactos_sin_ver) + ' mensajes</span></div>' +
      '</div>' +

      '<div class="rejilla"><div class="caja"><h2>Registros y reservas por día</h2><p class="sub2">Últimos ' + d.dias + ' días</p>' +
      '<div class="leyenda"><span><i style="background:#7C3AED"></i>Registros</span><span><i style="background:#DB2777"></i>Reservas</span></div>' + grafico(d.por_dia || []) + '</div>' +
      '<div class="caja"><h2>Reservas por estado</h2><p class="sub2">Desde el principio</p>' +
      (Object.keys(estados).length ? Object.keys(estados).map(function (e) { return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--borde)">' + chipEstado(e) + '<b>' + num(estados[e]) + '</b></div>'; }).join('') : '<div class="vacio2">Aún no hay reservas.</div>') +
      '<h2 style="margin-top:18px">Lo más reservado</h2>' +
      ((d.top_servicios || []).length ? d.top_servicios.map(function (x) { return '<div class="barra-h"><span>' + esc(x.categoria) + '</span><div><span style="width:' + Math.round(x.reservas / maxTop * 100) + '%"></span></div><b>' + num(x.reservas) + '</b></div>'; }).join('') : '<div class="vacio2">Sin datos todavía.</div>') +
      '</div></div>' +

      (v ? '<div class="rejilla"><div class="caja"><h2>Páginas más vistas</h2><p class="sub2">Últimos ' + d.dias + ' días</p>' + barras(v.paginas, 'pagina') + '</div>' +
      '<div class="caja"><h2>De dónde llegan</h2><p class="sub2">Google, Instagram, WhatsApp…</p>' + barras(v.origenes, 'origen') + '</div></div>' : '') +

      '<div class="rejilla"><div class="caja"><h2>Últimas reservas</h2><div class="tabla-scroll"><table class="lista"><thead><tr><th>Creada</th><th>Servicio</th><th>Cliente</th><th>Profesional</th><th>Cita</th><th>Total</th><th>Estado</th></tr></thead><tbody>' +
      ((d.ultimas_reservas || []).map(function (r) { return '<tr><td>' + fecha(r.creada_en) + '</td><td>' + esc(r.servicio) + '</td><td>' + esc(r.cliente) + '</td><td>' + esc(r.profesional) + '</td><td>' + fecha(r.empieza) + '</td><td>' + euros(r.total_cent) + ' <span class="meta">' + esc(r.metodo_pago || '') + '</span></td><td>' + chipEstado(r.estado) + '</td></tr>'; }).join('') || '<tr><td colspan="7" class="vacio2">Aún no hay reservas.</td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="caja"><h2>Últimos registros</h2><div class="tabla-scroll"><table class="lista"><thead><tr><th>Nombre</th><th>Tipo</th><th>Cuándo</th></tr></thead><tbody>' +
      ((d.ultimos_registros || []).map(function (u) { return '<tr><td><b>' + esc(u.nombre || '(sin nombre)') + '</b><div class="meta">' + esc(u.email) + '</div></td><td><span class="chip">' + esc(ROLES[u.rol] || u.rol) + '</span></td><td>' + fecha(u.creado_en) + '</td></tr>'; }).join('') || '<tr><td colspan="3" class="vacio2">Nadie todavía.</td></tr>') +
      '</tbody></table></div></div></div>' +

      '<div class="rejilla"><div class="caja"><h2>Solicitudes de profesionales</h2><p class="sub2">Del formulario «Trabaja con nosotros» de la web</p><div class="tabla-scroll"><table class="lista"><thead><tr><th>Nombre</th><th>Especialidad</th><th>Zona</th><th>Contacto</th><th>Cuándo</th></tr></thead><tbody>' +
      ((d.solicitudes || []).map(function (s) { return '<tr><td><b>' + esc(s.nombre) + '</b>' + (s.revisada ? '' : ' <span class="chip aviso">Nueva</span>') + '</td><td>' + esc(s.especialidad) + '</td><td>' + esc(s.zona || '—') + '</td><td><a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>' + (s.telefono ? '<div class="meta">' + esc(s.telefono) + '</div>' : '') + '</td><td>' + fecha(s.creada_en) + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="vacio2">Sin solicitudes todavía.</td></tr>') +
      '</tbody></table></div></div>' +
      '<div class="caja"><h2>Mensajes de contacto</h2><div class="tabla-scroll"><table class="lista"><tbody>' +
      ((d.contactos || []).map(function (c) { return '<tr><td><span class="chip ' + (c.atendido ? 'ok' : 'aviso') + '">' + esc(c.tipo) + '</span> <b>' + esc(c.nombre || '') + '</b> <a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a><div style="margin-top:4px">' + esc(c.mensaje || '') + '</div><div class="meta">' + fecha(c.creado_en) + '</div></td></tr>'; }).join('') || '<tr><td class="vacio2">Sin mensajes.</td></tr>') +
      '</tbody></table></div></div></div>';

    var sel = document.getElementById('dias'); sel.value = String(dias);
    sel.addEventListener('change', function () { dias = Number(sel.value); cargar(); });
    document.getElementById('refrescar').addEventListener('click', cargar);
    document.getElementById('salir').addEventListener('click', async function () { await sb.auth.signOut(); pintarLogin(); });
  }

  async function cargar() {
    var s = await sb.auth.getSession();
    if (!s.data.session) return pintarLogin();
    var r = await sb.rpc('panel_dueno', { p_dias: dias });
    var rv = await sb.rpc('panel_visitas', { p_dias: dias });
    if (!r.error) r.data.visitas = rv.error ? null : rv.data;
    if (r.error) {
      if (/dueño/.test(r.error.message)) return pintarLogin('Esta cuenta no tiene acceso al panel. Entra con la cuenta del dueño.');
      vista.innerHTML = '<div class="caja">No se pudo cargar el panel: ' + esc(r.error.message) + '</div>'; return;
    }
    pintar(r.data);
  }

  cargar();
  setInterval(function () { if (!document.hidden && document.getElementById('refrescar')) cargar(); }, 120000);
})();
</script>
</body>
</html>
